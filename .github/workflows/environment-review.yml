name: Environment review
on:
  pull_request:
    branches: [integration/milestone-3-5-photoreal-survival]
    paths:
      - .github/workflows/environment-review.yml
      - tools/macos/compare_environments.py
      - tools/macos/diagnose_terrain.gd
      - scripts/diagnostics/integration_benchmark.gd
  workflow_call:
    inputs:
      paired:
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
jobs:
  metal:
    name: Native Metal environment comparison
    runs-on: macos-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: LastTrainOut-macos-universal.zip
          run-id: 44835867870
          github-token: ${{ github.token }}
          path: reference-download
          skip-decompress: true
      - name: Verify and extract the PR 6 reference
        run: |
          zip=$(find reference-download -name '*.zip' -type f)
          echo "95d5ccbc65700a2d1f7b8e641eef3fd880f35b34221d09077ebd58a45a49b5ee  $zip" | shasum -a 256 -c -
          ditto -x -k "$zip" reference
      - if: inputs.paired
        uses: actions/download-artifact@v8
        with:
          name: LastTrainOut-macos-universal.zip
          path: candidate-download
          skip-decompress: true
      - name: Render and measure the fixed views
        env:
          PAIRED: ${{ inputs.paired }}
        run: |
          args=()
          if [[ "$PAIRED" == true ]]; then
            ditto -x -k "$(find candidate-download -name '*.zip' -type f)" candidate
            args+=(--candidate "candidate/Last Train Out.app")
          fi
          python3 tools/macos/compare_environments.py "reference/Last Train Out.app" "$RUNNER_TEMP/world-review" "${args[@]}"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-metal-environment
          path: ${{ runner.temp }}/world-review
          retention-days: 30

  investigate-ground:
    name: Isolate the build 108 terrain defect on native Metal
    if: github.event_name == 'pull_request' && !inputs.paired
    runs-on: macos-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: LastTrainOut-macos-universal.zip
          run-id: 44850871725
          github-token: ${{ github.token }}
          path: build108
          skip-decompress: true
      - name: Compare fixed views with individual material and viewport changes
        run: |
          archive=$(find build108 -type f -name '*.zip')
          echo "e9b7573db2dd05a4109eb7c82bef304173c0ae8b1f598b707fc725dea3afd639  $archive" | shasum -a 256 -c -
          ditto -x -k "$archive" original
          app="$PWD/original/Last Train Out.app/Contents"
          mkdir -p "$RUNNER_TEMP/ground"
          "$app/MacOS/choose-renderer" metal --main-pack "$app/Resources/Last Train Out.pck" --resolution 960x540 --audio-driver Dummy --script "$PWD/tools/macos/diagnose_terrain.gd" -- --graphics=low --shots="$RUNNER_TEMP/ground" --out="$RUNNER_TEMP/ground/results.json" > "$RUNNER_TEMP/ground/probe.log" 2>&1
          python3 -c 'import json, sys; assert len(json.load(open(sys.argv[1]))) == 26' "$RUNNER_TEMP/ground/results.json"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build108-terrain-material-controls
          path: ${{ runner.temp }}/ground
          retention-days: 30
