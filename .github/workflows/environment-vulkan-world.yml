name: Isolate cold High Vulkan scene preparation
on:
  pull_request:
    branches: [integration/milestone-3-5-photoreal-survival]
    paths:
      - .github/workflows/environment-vulkan-world.yml
      - tools/macos/compare_vulkan_world.py
      - tools/macos/vulkan_world_probe.gd
      - tools/macos/compare_vulkan_presets.py
      - tools/macos/vulkan_preset_probe.gd
  workflow_dispatch:
    inputs:
      experiment:
        type: choice
        options: [camera-pair, world, preset-cycles]
        default: camera-pair
        description: Compare cold cameras, world components or in-play preset changes

permissions:
  contents: read
  actions: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      experiment: ${{ steps.scope.outputs.experiment }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - id: scope
        env:
          REQUESTED: ${{ inputs.experiment }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "experiment=$REQUESTED" >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet HEAD^ HEAD -- tools/macos/compare_vulkan_presets.py tools/macos/vulkan_preset_probe.gd; then
            echo 'experiment=preset-cycles' >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet HEAD^ HEAD -- \
            .github/workflows/environment-vulkan-world.yml tools/macos/compare_vulkan_world.py tools/macos/vulkan_world_probe.gd; then
            echo 'experiment=camera-pair' >> "$GITHUB_OUTPUT"
          fi

  world:
    needs: select
    if: needs.select.outputs.experiment != ''
    name: Vulkan ${{ needs.select.outputs.experiment }} / ${{ matrix.order }}
    runs-on: macos-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        order: [forward, reverse]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.select.outputs.experiment == 'preset-cycles' && '44869971053' || '44859769512' }}
          name: LastTrainOut-macos-universal.zip
          github-token: ${{ github.token }}
          path: download
          skip-decompress: true
      - name: Verify the exported game and recover the exact integration fog shader
        env:
          EXPERIMENT: ${{ needs.select.outputs.experiment }}
        run: |
          zip=download/LastTrainOut-macos-universal.zip
          sha=527af2233d5cb88ea444aded3c7d40b13f3a2176a52bd20d5c5ffb48f5df538a
          if [[ "$EXPERIMENT" == preset-cycles ]]; then sha=a3d71b678cd85545bf7aa5ddbe0145ad0f9b37961eb562b72afba0c3d4d05449; fi
          echo "$sha  $zip" | shasum -a 256 -c -
          ditto -x -k "$zip" candidate
          codesign --verify --strict --deep "candidate/Last Train Out.app"
          if [[ "$EXPERIMENT" == preset-cycles ]]; then exit 0; fi
          base=684df38f0d9ba39a876d4788696855f0b64d5b29
          git fetch --no-tags --depth=1 origin "$base"
          git show "$base:scripts/fog/fog_front.gdshader" > "$RUNNER_TEMP/base-fog.gdshader"
      - name: Rotate isolated fresh-cache starts and retain each attempt
        env:
          ORDER: ${{ matrix.order }}
          EXPERIMENT: ${{ needs.select.outputs.experiment }}
        run: |
          args=()
          if [[ "$ORDER" == reverse ]]; then args+=(--reverse); fi
          if [[ "$EXPERIMENT" == preset-cycles ]]; then
            python3 tools/macos/compare_vulkan_presets.py "candidate/Last Train Out.app" "$RUNNER_TEMP/world" "${args[@]}"
            exit
          fi
          if [[ "$EXPERIMENT" == camera-pair ]]; then args+=(--camera-pair); fi
          python3 tools/macos/compare_vulkan_world.py "candidate/Last Train Out.app" \
            "$RUNNER_TEMP/base-fog.gdshader" "$RUNNER_TEMP/world" "${args[@]}"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vulkan-${{ needs.select.outputs.experiment }}-${{ matrix.order }}
          path: ${{ runner.temp }}/world
          retention-days: 30
