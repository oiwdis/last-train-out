name: Renderer investigation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/renderer-lab.yml
      - tools/macos/renderer_lab.py
      - tools/macos/renderer_probe.gd
      - tools/macos/exported_renderer_lab.py
      - tools/macos/exported_shadow_probe.gd

permissions:
  contents: read
  actions: read

jobs:
  select:
    name: Check investigation inputs
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.select.outputs.run }}
      exported: ${{ steps.select.outputs.exported }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - id: select
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! git diff --quiet HEAD^ HEAD -- tools/macos/renderer_lab.py tools/macos/renderer_probe.gd; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! git diff --quiet HEAD^ HEAD -- tools/macos/exported_renderer_lab.py tools/macos/exported_shadow_probe.gd; then
            echo 'exported=true' >> "$GITHUB_OUTPUT"
          fi

  isolate:
    needs: select
    if: needs.select.outputs.run == 'true'
    name: Diagnostic / ${{ matrix.group }}
    runs-on: macos-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        group: [minimal, workload, history, backends]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/cache/restore@v6
        with:
          path: ~/godot-ci
          key: godot-4.5.1-stable-macos-universal-template-v1
      - run: tools/macos/install_godot.sh
      - uses: actions/cache/restore@v6
        if: matrix.group != 'minimal'
        id: imports
        with:
          path: .godot/imported
          key: godot-imports-macos-arm64-4.5.1-v1-${{ hashFiles('project.godot', 'assets/**', 'resources/**') }}
          restore-keys: godot-imports-macos-arm64-4.5.1-v1-
      - name: Prepare source resources on a cache miss
        if: matrix.group != 'minimal' && steps.imports.outputs.cache-hit != 'true'
        run: '"$GODOT" --headless --path . --import'
      - name: Fetch the three measured source revisions
        if: matrix.group != 'minimal'
        run: |
          for rev in 7df2f5abee54b8adcf27b8668263fba231a79033 cc50670c9ae70aa2de7ce92185a229d284c075f8 6038bfcd0f0c5427ae6c53435d2867282938f6e4; do
            git fetch --no-tags --depth=1 origin "$rev"
          done
      - name: Run bounded native experiments and retain partial evidence
        run: python3 tools/macos/renderer_lab.py "$GODOT" "${{ matrix.group }}" "$RUNNER_TEMP/renderer-lab"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: renderer-lab-${{ matrix.group }}
          path: ${{ runner.temp }}/renderer-lab
          retention-days: 30

  exported:
    needs: select
    if: needs.select.outputs.exported == 'true'
    name: Original exported app / ${{ matrix.group }}
    runs-on: macos-latest
    timeout-minutes: 48
    strategy:
      fail-fast: false
      matrix:
        group: [shadows, packaged-backends]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: LastTrainOut-macos-universal.zip
          run-id: 44608806260
          github-token: ${{ github.token }}
          path: download
          skip-decompress: true
      - name: Verify original release archive and unpack
        run: |
          zip=$(find download -name '*.zip' -type f | head -n 1)
          echo "e1cff244b9edf7a8af1b6371ad311a4cf0fafa79301beb3ecaec2517ae837159  $zip" | shasum -a 256 -c -
          ditto -x -k "$zip" extracted
      - run: python3 tools/macos/exported_renderer_lab.py 'extracted/Last Train Out.app' "${{ matrix.group }}" "$RUNNER_TEMP/exported-lab"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: original-export-${{ matrix.group }}
          path: ${{ runner.temp }}/exported-lab
          retention-days: 30
